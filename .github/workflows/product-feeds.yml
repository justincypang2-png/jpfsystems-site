# Load every approved shop's products (photos, prices, stock, delivery) into the NoLag database.
# Nightly: Awin shops and local shops. Every 2 hours from about 7am to 9pm, and whenever local-shops.json changes: local shops only.
# Free on GitHub. Needs four repository secrets (Settings > Secrets and variables > Actions):
#   AWIN_FEED_LIST_URL, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID
name: Product feeds
on:
  schedule:
    - cron: '17 3 * * *'        # every night at about 3am UK time: everything
    - cron: '47 7-21/2 * * *'   # every 2 hours in the day: local shops' product lists
  push:
    branches: [main]
    paths: ['local-shops.json'] # a shop was added or changed: load its products straight away
  workflow_dispatch: {}         # or run it now from the Actions tab
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load shop product feeds
        run: node api/engine/import.mjs
        env:
          FEED_LIST_URL: ${{ secrets.AWIN_FEED_LIST_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          LOCAL_ONLY: ${{ (github.event_name == 'push' || github.event.schedule == '47 7-21/2 * * *') && '1' || '' }}
