# Puts the NoLag API (api/worker.js) live on Cloudflare whenever it changes, and stores the eBay, Amazon and CJ keys as Worker secrets.
# Needs repository secrets: CLOUDFLARE_API_TOKEN (permissions: Workers Scripts Edit, D1 Edit), CLOUDFLARE_ACCOUNT_ID.
# Optional: EBAY_CLIENT_ID, EBAY_CLIENT_SECRET (live eBay listings), EPN_CAMPAIGN_ID (eBay Partner Network commission),
# AMAZON_CREDENTIAL_ID, AMAZON_CREDENTIAL_SECRET, AMAZON_PARTNER_TAG (live Amazon Prime items, Creators API; needs 10 Amazon sales in 30 days),
# CJ_TOKEN, CJ_COMPANY_ID, CJ_WEBSITE_ID, CJ_ADVERTISER_IDS (Argos and other CJ shops that have accepted you).
name: Deploy API
on:
  push:
    branches: [main]
    paths: ['api/worker.js', 'api/wrangler.toml']
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      EPN_CAMPAIGN_ID: ${{ secrets.EPN_CAMPAIGN_ID }}
      AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
      AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
      AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
      CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
      CJ_COMPANY_ID: ${{ secrets.CJ_COMPANY_ID }}
      CJ_WEBSITE_ID: ${{ secrets.CJ_WEBSITE_ID }}
      CJ_ADVERTISER_IDS: ${{ secrets.CJ_ADVERTISER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the Cloudflare token is saved
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing was deployed."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Deploy
        if: env.SKIP != '1'
        working-directory: api
        run: npx --yes wrangler@4 deploy
      - name: Save eBay, Amazon and CJ keys as Worker secrets
        if: env.SKIP != '1'
        working-directory: api
        run: |
          for k in EBAY_CLIENT_ID EBAY_CLIENT_SECRET EPN_CAMPAIGN_ID AMAZON_CREDENTIAL_ID AMAZON_CREDENTIAL_SECRET AMAZON_PARTNER_TAG CJ_TOKEN CJ_COMPANY_ID CJ_WEBSITE_ID CJ_ADVERTISER_IDS; do
            v="${!k}"; if [ -n "$v" ]; then printf %s "$v" | npx --yes wrangler@4 secret put "$k"; fi
          done
